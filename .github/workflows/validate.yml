name: Validate

# Reusable workflow. Called by both ci.yml (branch/PR) and
# build-and-publish.yml (release tag) so the checks are defined once.
on:
  workflow_call:

permissions:
  contents: read

# @kippenstummel/credlib is a git dependency, so npm clones it and runs a full
# install to build it before the actual install proceeds. That extra round trip
# is where ECONNRESET tends to hit. These are read by the nested npm process too.
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    # Jest has been known to hang on open handles here; fail fast instead of
    # letting the job idle until GitHub's 360 minute default kicks in.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The e2e suite spins up mongo:8 and redis:8 via Testcontainers.
      # Docker is preinstalled on GitHub-hosted ubuntu runners.
      - name: Run e2e tests
        run: npm run test:e2e
