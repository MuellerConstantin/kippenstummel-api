name: Validate

# Reusable workflow. Called by both ci.yml (branch/PR) and
# build-and-publish.yml (release tag) so the checks are defined once.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The e2e suite spins up mongo:8 and redis:8 via Testcontainers.
      # Docker is preinstalled on GitHub-hosted ubuntu runners.
      - name: Run e2e tests
        run: npm run test:e2e
